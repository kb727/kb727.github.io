    <script type="text/javascript">
    document.addEventListener('DOMContentLoaded', function() {
        // Optimization: Using event delegation to handle all card click events instead of inline onclick
        document.addEventListener('click', function(e) {
            var target = e.target;
            while (target && !target.classList.contains('xe-widget')) {
                target = target.parentElement;
            }
            if (target && target.dataset.href) {
                window.open(target.dataset.href, '_blank', 'noopener,noreferrer');
            }
        });

        document.addEventListener('keydown', function(e) {
            var target = e.target;
            if (target.classList.contains('xe-widget') && target.dataset.href) {
                if (e.which === 13 || e.which === 32) {
                    e.preventDefault();
                    window.open(target.dataset.href, '_blank', 'noopener,noreferrer');
                }
            }
        });

        // Add accessibility attributes to clickable cards
        var widgets = document.querySelectorAll('.xe-widget[data-href]');
        widgets.forEach(function(widget) {
            var title = widget.getAttribute('data-original-title') || widget.getAttribute('title') || 'Open link';
            widget.setAttribute('role', 'button');
            widget.setAttribute('tabindex', '0');
            widget.setAttribute('aria-label', title);
        });
    });
    </script>

    <script>
    // 分享到微信
    function shareToWeChat() {
        var currentUrl = window.location.href;
        var modal = document.getElementById('wechatModal');
        var qrCode = document.getElementById('wechatQRCode');
        var qrUrl = document.getElementById('qrUrl');
        
        // 固定指向kb727.com/../../index.html
        var fixedUrl = 'https://kb727.com';
        
        // 使用API生成二维码
        qrCode.src = 'https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=' + encodeURIComponent(fixedUrl);
        qrUrl.textContent = fixedUrl;
        
        // 显示模态框
        modal.style.display = 'flex';
        
        // 防止页面滚动
        document.body.style.overflow = 'hidden';
    }

    function closeWeChatModal() {
        var modal = document.getElementById('wechatModal');
        modal.style.display = 'none';
        document.body.style.overflow = 'auto';
    }

    // 点击模态框外部关闭
    window.onclick = function(event) {
        var modal = document.getElementById('wechatModal');
        if (event.target == modal) {
            closeWeChatModal();
        }
    }

    // 分享到抖音
    function shareToDouyin() {
        var currentUrl = window.location.href;
        var currentTitle = document.title;
        
        if (navigator.share) {
            navigator.share({
                title: currentTitle,
                url: currentUrl
            }).then(function() {
                console.log('分享成功');
            }).catch(function(error) {
                console.log('分享失败:', error);
                copyToClipboard(currentUrl);
                alert('链接已复制到剪贴板，可以粘贴到抖音分享');
            });
        } else {
            copyToClipboard(currentUrl);
            alert('链接已复制到剪贴板，可以粘贴到抖音分享');
        }
    }

    // 分享到小红书
    function shareToXiaohongshu() {
        var currentUrl = window.location.href;
        var currentTitle = document.title;
        
        if (navigator.share) {
            navigator.share({
                title: currentTitle,
                url: currentUrl
            }).then(function() {
                console.log('分享成功');
            }).catch(function(error) {
                console.log('分享失败:', error);
                copyToClipboard(currentUrl);
                alert('链接已复制到剪贴板，可以粘贴到小红书分享');
            });
        } else {
            copyToClipboard(currentUrl);
            alert('链接已复制到剪贴板，可以粘贴到小红书分享');
        }
    }

    // 复制到剪贴板辅助函数
    function copyToClipboard(text) {
        var textarea = document.createElement('textarea');
        textarea.value = text;
        textarea.style.position = 'fixed';
        textarea.style.opacity = '0';
        document.body.appendChild(textarea);
        textarea.select();
        try {
            document.execCommand('copy');
            console.log('复制成功');
        } catch (err) {
            console.error('复制失败:', err);
        }
        document.body.removeChild(textarea);
    }
    </script>
