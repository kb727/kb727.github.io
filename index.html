<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Platform Maintenance Notice</title>
<style>
  :root {
    --brand: #669900;
    --brand-light: #8fbf1f;
    --brand-dark: #3d5c00;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html,
  body {
    height: 100%;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    font-family: "Segoe UI", "Helvetica Neue", Arial, "PingFang SC", sans-serif;
    color: #fff;
    background: linear-gradient(135deg, var(--brand-light) 0%, var(--brand) 45%, var(--brand-dark) 100%);
    background-attachment: fixed;
    -webkit-font-smoothing: antialiased;
  }

  .notice {
    position: relative;
    width: 100%;
    max-width: 640px;
    padding: 56px 44px 48px;
    text-align: center;
    border-radius: 20px;
    background: rgba(255, 255, 255, 0.12);
    border: 1px solid rgba(255, 255, 255, 0.28);
    box-shadow: 0 24px 60px rgba(30, 45, 0, 0.3);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    animation: rise 0.8s ease-out both;
  }

  .badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 64px;
    height: 64px;
    margin-bottom: 28px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.18);
    border: 1px solid rgba(255, 255, 255, 0.35);
    animation: pulse 2.8s ease-in-out infinite;
  }

  .badge svg {
    width: 30px;
    height: 30px;
    stroke: #fff;
  }

  h1 {
    font-size: clamp(22px, 4.2vw, 30px);
    font-weight: 700;
    line-height: 1.45;
    letter-spacing: 0.3px;
    text-shadow: 0 2px 12px rgba(30, 45, 0, 0.25);
  }

  .support {
    margin-top: 22px;
    font-size: clamp(15px, 2.6vw, 17px);
    line-height: 1.7;
    color: rgba(255, 255, 255, 0.88);
  }

  .support a {
    color: #fff;
    font-weight: 600;
    text-decoration: none;
    border-bottom: 1px solid rgba(255, 255, 255, 0.55);
    padding-bottom: 1px;
    transition: color 0.2s ease, border-color 0.2s ease;
  }

  .support a:hover {
    color: #f0ffd0;
    border-color: #f0ffd0;
  }

  .divider {
    width: 56px;
    height: 3px;
    margin: 30px auto 0;
    border-radius: 2px;
    background: rgba(255, 255, 255, 0.55);
  }

  footer {
    position: absolute;
    bottom: 22px;
    left: 0;
    width: 100%;
    text-align: center;
    font-size: 12px;
    letter-spacing: 0.6px;
    color: rgba(255, 255, 255, 0.6);
  }

  @keyframes rise {
    from {
      opacity: 0;
      transform: translateY(24px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  @keyframes pulse {
    0%, 100% {
      transform: scale(1);
      box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.35);
    }
    50% {
      transform: scale(1.04);
      box-shadow: 0 0 0 14px rgba(255, 255, 255, 0);
    }
  }

  @media (max-width: 480px) {
    .notice {
      padding: 40px 24px 36px;
      border-radius: 16px;
    }
  }
</style>
</head>
<body>
  <main class="notice">
    <div class="badge" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="9"></circle>
        <line x1="12" y1="8" x2="12" y2="13"></line>
        <line x1="12" y1="16.5" x2="12" y2="16.6"></line>
      </svg>
    </div>

    <h1>Our platform is undergoing major adjustments.</h1>

    <p class="support">
      For inquiries, please contact
      <a href="mailto:business@kb727.com">business@kb727.com</a>
    </p>

    <div class="divider"></div>
  </main>

  <footer>&copy; 2026 All rights reserved.</footer>
</body>
</html>
